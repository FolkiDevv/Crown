name: CI
# Crown (CROWN.md, "Ветки и выпуск"): features reach develop through pull requests, develop reaches main through release
# pull requests. CI runs on those pull requests and on pushes to the two branches, not on every pushed branch.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:testOssDebugUnitTest app:assembleOssDebug
  # What merging into main publishes (release.yml). Into main only develop and hotfix/* are merged, and the plan must
  # be publishable; into develop the plan only warns.
  release-plan:
    name: Release plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Release plan
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" = main ]; then
            case "$HEAD" in
              develop | hotfix/*) ;;
              *)
                echo "::error::main takes pull requests from develop (releases) and hotfix/* only: retarget this one to develop"
                exit 1
                ;;
            esac
            bash buildScript/release_plan.sh --check
          else
            bash buildScript/release_plan.sh --check --warn
          fi
