name: Release
# Crown: a manual run publishes the stable release v<VERSION_NAME> (fork.properties) at the run's commit, then raises
# PATCH in fork.properties on the default branch so that the next pushes publish previews of the next version.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release v<VERSION_NAME> at this commit (otherwise the APKs are only uploaded as a workflow artifact)
        type: boolean
        default: true
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    name: Build and publish a release
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # The tag is v<VERSION_NAME>; a published release never reuses an existing tag.
      - name: Version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' fork.properties | tr -d '\r[:space:]')
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          if [ "$PUBLISH" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists: raise VERSION_NAME in fork.properties for a new release"
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: stable
          build-number: '999'
          sign: 'true'
      - name: Release assets
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist stable
      - name: Upload artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Crown-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # The notes are the version's section of the fork changelog (fork.properties CHANGELOG), else the commits since
      # the previous stable release.
      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release.md"
          if ! bash buildScript/release_notes.sh "$VERSION_NAME" > "$NOTES"; then
            echo "::warning::No '#### $VERSION_NAME' section in the changelog: the release notes list the commits"
            PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^ 2>/dev/null || true)
            RANGE=${PREV:+$PREV..}HEAD
            TOTAL=$(git rev-list --count --no-merges "$RANGE")
            {
              git log --no-merges --format='* %s' -n 50 "$RANGE"
              if [ "$TOTAL" -gt 50 ]; then echo "* … and $((TOTAL - 50)) more"; fi
            } > "$NOTES"
          fi
          gh release create "$TAG" dist/* --latest --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES"
      # Next version: PATCH + 1, unless the default branch already moved VERSION_NAME on. A push with GITHUB_TOKEN
      # starts no workflow, so the bump itself publishes no preview.
      - name: Raise the patch version
        if: ${{ inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -q -B "$BRANCH" "origin/$BRANCH"
          CURRENT=$(sed -n 's/^VERSION_NAME=//p' fork.properties | tr -d '\r[:space:]')
          if [ "$CURRENT" != "$VERSION_NAME" ]; then
            echo "::notice::$BRANCH already has VERSION_NAME=$CURRENT"
            exit 0
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$NEXT/" fork.properties
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -am "fork.properties: VERSION_NAME=$NEXT after the release v$VERSION_NAME"
          if git push origin "HEAD:$BRANCH"; then
            echo "::notice::VERSION_NAME raised to $NEXT on $BRANCH: pull it before the next commit"
          else
            echo "::warning::Could not push the version bump: set VERSION_NAME=$NEXT (or higher) in fork.properties yourself"
          fi
