name: Release
# Crown (CROWN.md, "Ветки и выпуск"): every push to main — a merged release pull request from develop or a hotfix —
# publishes a release of what fork.properties declares: RELEASE=preview publishes v<VERSION_NAME>-pre.<N>, N one above
# the newest published preview of that version; RELEASE=stable publishes v<VERSION_NAME> (skipped when it already
# exists). A manual run on main does the same; on another branch it only uploads the APKs as a workflow artifact.
# Pushes to develop and feature branches publish nothing; ci.yml checks the plan on pull requests into main.
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
env:
  # pre-releases kept on GitHub: the updater reads the newest 20 releases, so stable ones must stay among them
  KEEP_PREVIEWS: 3
  # A pre-release that always holds the newest preview's APKs: a fixed link releases/download/preview/Crown-<abi>.apk.
  # It has no throne-update.json and its tag is not a version, so the in-app updater and release_plan.sh ignore it.
  PREVIEW_TAG: preview
jobs:
  release:
    name: Build and publish a release
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          bash buildScript/release_plan.sh | tee -a "$GITHUB_OUTPUT" > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          TAG=$(sed -n 's/^tag=//p' "$RUNNER_TEMP/plan")
          EXISTS=$(sed -n 's/^exists=//p' "$RUNNER_TEMP/plan")
          PUBLISH=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then PUBLISH=true; fi
          SKIP=false
          if [ "$PUBLISH" = true ] && [ "$EXISTS" = true ]; then
            echo "::notice::$TAG is already published: raise VERSION_NAME in fork.properties for the next release"
            SKIP=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.plan.outputs.skip != 'true'
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: ${{ steps.plan.outputs.channel }}
          build-number: ${{ steps.plan.outputs.build }}
          sign: 'true'
      - name: Release assets
        if: steps.plan.outputs.skip != 'true'
        env:
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist "$CHANNEL"
      - name: Upload artifact
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Crown-${{ steps.plan.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # Notes: a stable release takes its version's section of the fork changelog (fork.properties CHANGELOG), else the
      # commits since the previous stable release; a preview lists the commits since the previous release or preview
      # (the in-app updater falls back to this body).
      - name: Publish
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          commits() {
            local range=${1:+$1..}HEAD total
            total=$(git rev-list --count --no-merges "$range")
            git log --no-merges --format='* %s' -n "$2" "$range"
            if [ "$total" -gt "$2" ]; then echo "* … and $((total - $2)) more"; fi
          }
          if [ "$CHANNEL" = stable ]; then
            if ! bash buildScript/release_notes.sh "$VERSION_NAME" > "$NOTES"; then
              echo "::warning::No '#### $VERSION_NAME' section in the changelog: the release notes list the commits"
              PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^ 2>/dev/null || true)
              commits "$PREV" 50 > "$NOTES"
            fi
            gh release create "$TAG" dist/* --latest --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES"
          else
            PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
            {
              echo "Preview build of \`$(git rev-parse --short HEAD)\`."
              echo
              commits "$PREV" 30
              if [ -n "$PREV" ]; then
                echo
                echo "**Full changelog**: https://github.com/$GH_REPO/compare/$PREV...$TAG"
              fi
            } > "$NOTES"
            gh release create "$TAG" dist/* --prerelease --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES"
          fi
      - name: Update the preview link
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.publish == 'true' && steps.plan.outputs.channel == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$PREVIEW_TAG" > /dev/null 2>&1; then
            gh release delete "$PREVIEW_TAG" --cleanup-tag --yes
          fi
          gh release create "$PREVIEW_TAG" dist/*.apk dist/SHA256SUMS --prerelease --target "$GITHUB_SHA" \
            --title "Latest preview ($TAG)" \
            --notes "The newest preview, currently [$TAG](https://github.com/$GH_REPO/releases/tag/$TAG). Every preview replaces this release, so its download links stay the same."
      - name: Prune old previews
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.publish == 'true' && steps.plan.outputs.channel == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease and .tagName != \"$PREVIEW_TAG\")] | sort_by(.createdAt) | reverse | .[${KEEP_PREVIEWS}:] | .[].tagName" |
          while read -r OLD; do
            echo "Deleting the old preview $OLD"
            gh release delete "$OLD" --cleanup-tag --yes
          done
