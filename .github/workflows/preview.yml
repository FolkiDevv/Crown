name: Preview
# Crown: every push to the default branch publishes a signed pre-release v<VERSION_NAME>-pre.<N> of the same package as
# the stable releases; the in-app updater offers it when beta updates are allowed. A manual run on another branch only
# uploads the APKs as a workflow artifact.
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  # pre-releases kept on GitHub: the updater reads the newest 20 releases, so stable ones must stay among them
  KEEP_PREVIEWS: 10
jobs:
  preview:
    name: Build and publish a preview
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # N = 1 + first-parent commits since VERSION_NAME last changed in fork.properties (at most 998, so previews of
      # X.Y.Z sort below its release, build 999). First-parent: a merge of upstream counts as one commit.
      - name: Version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' fork.properties | tr -d '\r[:space:]')
          test -n "$VERSION_NAME"
          if git rev-parse -q --verify "refs/tags/v$VERSION_NAME" > /dev/null; then
            echo "::warning::v$VERSION_NAME is already released: raise VERSION_NAME in fork.properties to publish previews of the next version"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(git log -1 --first-parent --format=%H -G '^VERSION_NAME=' -- fork.properties)
          test -n "$BASE"
          BUILD=$(( $(git rev-list --count --first-parent "$BASE..HEAD") + 1 ))
          if [ "$BUILD" -gt 998 ]; then
            echo "::error::$BUILD previews of $VERSION_NAME: release it or raise VERSION_NAME in fork.properties"
            exit 1
          fi
          TAG="v${VERSION_NAME}-pre.${BUILD}"
          PUBLISH=false
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then PUBLISH=true; fi
          if [ "$PUBLISH" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Preview $TAG (VERSION_NAME set in ${BASE:0:12}), publish: $PUBLISH"
          {
            echo "skip=false"
            echo "publish=$PUBLISH"
            echo "build=$BUILD"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: preview
          build-number: ${{ steps.version.outputs.build }}
          sign: 'true'
      - name: Release assets
        if: steps.version.outputs.skip != 'true'
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist preview
      - name: Upload artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Crown-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # Notes: the commits since the previous release or preview (the in-app updater falls back to this body).
      - name: Publish pre-release
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          TOTAL=$(git rev-list --count --no-merges "$RANGE")
          {
            echo "Preview build of \`$(git rev-parse --short HEAD)\`."
            echo
            git log --no-merges --format='* %s' -n 30 "$RANGE"
            if [ "$TOTAL" -gt 30 ]; then echo "* … and $((TOTAL - 30)) more"; fi
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GH_REPO/compare/$PREV...$TAG"
            fi
          } > "$NOTES"
          gh release create "$TAG" dist/* --prerelease --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES"
      - name: Prune old previews
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[${KEEP_PREVIEWS}:] | .[].tagName" |
          while read -r OLD; do
            echo "Deleting the old preview $OLD"
            gh release delete "$OLD" --cleanup-tag --yes
          done
