# Crown: identity and version of this fork (buildSrc Fork.kt, buildScript/release_plan.sh, .github/workflows/release.yml).
# nb4a.properties stays identical to upstream: its VERSION_NAME is the Throne version this build is based on, and
# its THRONE_CORE_REF pins the core. Everything below overrides upstream for the app and its releases.

PACKAGE_NAME=dev.folki.crown
# MAJOR.MINOR.PATCH (MAJOR 0..20, MINOR and PATCH 0..99): the version being released. versionCode is derived from it.
VERSION_NAME=1.0.0
# What a merge into main publishes (CROWN.md, "Ветки и выпуск"): preview is the next preview v<VERSION_NAME>-pre.<N>
# (N counted from the published previews), stable is the release v<VERSION_NAME>. After a stable release, raise
# VERSION_NAME on develop and set RELEASE=preview again.
RELEASE=preview
# GitHub repository whose Releases the in-app updater reads (owner/name).
UPDATE_REPOSITORY=FolkiDevv/ThroneForAndroid
# Release notes: '#### <version>' sections, newest first (buildScript/release_notes.sh, update/ReleaseNotes.kt).
CHANGELOG=CROWN_CHANGELOG.md
# APK file names: <ARTIFACT_NAME>-<versionName>-<abi>.apk; release assets drop the version: <ARTIFACT_NAME>-<abi>.apk
ARTIFACT_NAME=Crown
